name: CI

# Runs the full local quality gate on every push and pull request.
# These are the exact commands documented in README.md and CONTRIBUTING.md, so
# CI can never drift from what a developer runs locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Format · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test -- --ci

      - name: End-to-end demo (headless core loop)
        run: npm run demo
