<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="skyMint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFE9FF"/>
      <stop offset="100%" stop-color="#6FE0B0"/>
    </linearGradient>
    <filter id="pinShadow" x="-30%" y="-10%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="180" ry="180"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">

    <!-- Background: sky-to-mint vertical gradient -->
    <rect width="1024" height="1024" fill="url(#skyMint)"/>

    <!-- Map block: cream rounded rectangle centered ~(512,520) -->
    <rect x="312" y="380" width="400" height="310" rx="30" fill="#FFF8EE" stroke="#E8DDCC" stroke-width="4"/>

    <!-- Streets on the map (mint green, thick rounded lines) -->
    <line x1="330" y1="480" x2="690" y2="480" stroke="#A8EDCC" stroke-width="12" stroke-linecap="round"/>
    <line x1="340" y1="560" x2="680" y2="540" stroke="#A8EDCC" stroke-width="10" stroke-linecap="round"/>

    <!-- Trail winding path (warm cream, rounded caps, leading up to pin) -->
    <path d="M 360 670 Q 390 610 430 570 Q 470 530 512 510 Q 512 480 512 460" stroke="#FFF8EE" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- Fog wedge peeling off top-left corner of map -->
    <path d="M 174 174 L 460 174 Q 500 200 490 240 Q 480 280 450 300 Q 420 340 380 360 Q 330 390 280 400 Q 230 410 200 440 Q 174 460 174 500 Z" fill="#B8F0D8" fill-opacity="0.82"/>

    <!-- Map pin group with drop shadow -->
    <g filter="url(#pinShadow)">
      <!-- Pin body: inverted teardrop, coral -->
      <path d="M 512 600 C 460 560 442 510 442 472 A 70 70 0 1 1 582 472 C 582 510 564 560 512 600 Z" fill="#FF7A66" stroke="#CC4433" stroke-width="8"/>
      <!-- Cream dot inside pin circle -->
      <circle cx="512" cy="455" r="28" fill="#FFF8EE"/>
    </g>

  </g>
</svg>
